# PI_T1 — Processamento de Imagens (WPF locomotiva 2D)
# SonarQube Community 26.9 — config de analise XML/XAML do WPF
# XAML sao arquivos XML com extensao .xaml, UTF-8 tipico:
# https://learn.microsoft.com/pt-br/dotnet/desktop/wpf/xaml/
# XML no .NET via System.Xml / LINQ to XML:
# https://learn.microsoft.com/pt-br/dotnet/standard/data/xml/
sonar.projectKey=PI_T1
sonar.projectName=PI_T1
sonar.projectVersion=1.0
sonar.sources=.
sonar.sourceEncoding=UTF-8

# C# apenas para arquivos .cs
sonar.cs.file.suffixes=.cs

# XML inclui XAML do WPF + configs do .NET (App.config, .resx, .csproj)
sonar.xml.file.suffixes=.xml,.xaml,.axaml,.config,.resx,.settings,.csproj,.props,.targets
sonar.cpd.exclusions=**/*.xaml,**/docs/astro.config.mjs
 
# Exclui build, VCS, docs binarias e pastas de tooling
sonar.exclusions=**/bin/**,**/obj/**,**/.git/**,**/.agents/**,**/.gemini/**,**/node_modules/**,**/dist/**,**/.astro/**,**/*.pdf,**/Slide/PDF/**,**/Trabalho/PDF/**
sonar.test.exclusions=**/*Test*/**,**/test/**,**/*.test.*,**/*Tests*/**

# Exclusao da regra css:S4662 (Unknown at-rule) para a diretiva @unocss do PostCSS
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e1.resourceKey=**/custom.css

# Sem git neste workspace
sonar.scm.disabled=true
