<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Modern Industrial Locomotive Icon in Electric Cyan / Amber -->
  <rect width="64" height="64" rx="14" fill="#090d16"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Rails -->
  <line x1="6" y1="52" x2="58" y2="52" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="12" y2="54" stroke="#64748b" stroke-width="2"/>
  <line x1="24" y1="50" x2="24" y2="54" stroke="#64748b" stroke-width="2"/>
  <line x1="36" y1="50" x2="36" y2="54" stroke="#64748b" stroke-width="2"/>
  <line x1="48" y1="50" x2="48" y2="54" stroke="#64748b" stroke-width="2"/>

  <!-- Cabin -->
  <path d="M12 24 H26 V44 H12 Z" fill="#1e293b" stroke="#00d2ff" stroke-width="2"/>
  <!-- Cabin Window -->
  <rect x="16" y="28" width="6" height="6" rx="1" fill="#00d2ff" fill-opacity="0.3" stroke="#00d2ff" stroke-width="1.5"/>

  <!-- Boiler -->
  <path d="M26 28 H50 V44 H26 Z" fill="#0f172a" stroke="#00d2ff" stroke-width="2"/>
  
  <!-- Chimney -->
  <path d="M42 28 V18 H46 V28" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="40" y="16" width="8" height="3" rx="1" fill="#f59e0b"/>

  <!-- Cowcatcher / Front -->
  <path d="M50 38 L56 44 H50 Z" fill="#334155" stroke="#00d2ff" stroke-width="1.5"/>

  <!-- Steam puffs -->
  <circle cx="44" cy="11" r="2.5" fill="#00d2ff" fill-opacity="0.4"/>
  <circle cx="48" cy="7" r="3" fill="#00d2ff" fill-opacity="0.2"/>

  <!-- Driving Wheels -->
  <circle cx="22" cy="44" r="6" fill="#0b111e" stroke="#00d2ff" stroke-width="2"/>
  <circle cx="22" cy="44" r="2" fill="#00d2ff"/>
  <circle cx="36" cy="44" r="6" fill="#0b111e" stroke="#00d2ff" stroke-width="2"/>
  <circle cx="36" cy="44" r="2" fill="#00d2ff"/>

  <!-- Side Rod -->
  <line x1="22" y1="44" x2="36" y2="44" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
